# Ruff configuration for the Python tools in this repository.
#
# Rules are pinned explicitly so that linting results are reproducible and do
# not drift when Ruff changes its default rule set between releases.

line-length = 120
target-version = "py310"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort import ordering
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
]
ignore = [
    # These scripts are dense single-file CLI tools whose long lines are mostly
    # menu tables and ANSI-formatted output strings. Enforcing a hard wrap here
    # would add churn without improving readability.
    "E501",
]

[lint.per-file-ignores]
# Standalone entry-point scripts are executed directly, not imported.
"python/*.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"