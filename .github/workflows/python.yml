name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade pip ruff
      - name: Ruff check
        run: ruff check python

  compile:
    name: Byte-compile all tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure every script compiles
        run: python -m compileall -q python

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade pip pytest

      - name: Run tests
        run: pytest python/tests -v

      - name: Guard module names
        run: |
          import pathlib, sys
          bad = [p.name for p in pathlib.Path('python').glob('*.py') if ' ' in p.name]
          if bad:
              print(f'Python filenames must not contain spaces: {bad}')
              sys.exit(1)
          print('All Python filenames are import-safe.')